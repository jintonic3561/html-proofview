# タグの付け方は docs/release.md。
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Dockerfile の NODE_VERSION に合わせる
          cache: npm
      - run: npm ci

      - name: タグと package.json の version が一致するか
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag と package.json の version $ver が一致しない"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: GitHub Release（CHANGELOG.md の該当節をリリースノートにする）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # PAT ではなく Entra ID のアプリ登録に GitHub OIDC で入り、その資格情報で publish する。
  # 資格情報を出せるのは environment「marketplace」の job だけ（Entra 側の federated credential の subject がこれ）。
  # 失敗してもこの job だけ re-run できるよう release job と分けている。
  marketplace:
    needs: release
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace から見たこの資格情報の ID（publisher のメンバーに追加するのはこの値）
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
      - run: npx vsce publish --azure-credential --packagePath ./*.vsix

  openvsx:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Secrets に OVSX_PAT が無いので Open VSX への publish はスキップ"
            exit 0
          fi
          npx --yes ovsx@1.2.0 publish ./*.vsix -p "$OVSX_PAT"
